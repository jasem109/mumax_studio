# The app lives in studio/ (the Go/CUDA mumax3 fork it ports is at the repo root).
# Builds the desktop app for Windows, Linux and macOS and attaches the installers to a GitHub Release.
# Trigger: push a tag like v0.2.0  (git tag v0.2.0 && git push origin v0.2.0), or run it by hand from the Actions tab.
# Every package bundles Python, NumPy, SciPy and Pillow, so users download one file and install nothing else.
# Asset names carry no version, so https://github.com/<owner>/<repo>/releases/latest/download/<name> always points
# at the newest build (the website's download buttons use these addresses).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: studio } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, edition: "" }
          - { os: windows-latest, edition: "-nvidia" }
          - { os: ubuntu-22.04, edition: "" }
          - { os: ubuntu-22.04, edition: "-nvidia" }
          - { os: macos-latest, edition: "" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: studio } }
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install build dependencies
        shell: bash
        run: |
          pip install -r requirements.txt
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Compile PyInstaller's bootloader here instead of using the prebuilt one. The stock bootloader is shared
            # by countless unrelated (some malicious) programs, so antivirus engines flag it by signature.
            PYINSTALLER_COMPILE_BOOTLOADER=1 pip install --no-binary pyinstaller pyinstaller
          else
            pip install pyinstaller
          fi
          if [ "$RUNNER_OS" != "Linux" ]; then pip install pywebview; fi
          # [ctk] brings the CUDA runtime compiler (NVRTC) and cuFFT; without them CuPy sees the GPU but fails on
          # the first kernel, which made the GPU entry in the device menu useless on machines without the toolkit
          if [ "${{ matrix.edition }}" = "-nvidia" ]; then pip install "cupy-cuda12x[ctk]"; fi
      - name: Build app
        shell: bash
        run: python build_exe.py ${{ matrix.edition == '-nvidia' && '--gpu' || '' }}
      - name: Smoke test
        if: runner.os == 'Linux'
        run: ./dist/mumax-studio/mumax-studio info

      # Code signing (Windows). Runs only when the repository has the Azure Trusted Signing secrets; see
      # studio/packaging/SIGNING.md. Signed files stop SmartScreen's "unknown publisher" warning.
      - name: Sign executables
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\studio\dist\mumax-studio
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package (Windows installer + portable zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "$env:VERSION".TrimStart("v"); if ($v -notmatch "^[0-9]+(\.[0-9]+){0,3}$") { $v = "0.0.0" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" "/DEdition=${{ matrix.edition }}" packaging\installer.iss
          Compress-Archive -Path dist\mumax-studio -DestinationPath "dist\mumax-studio-windows${{ matrix.edition }}-portable.zip"
      - name: Sign installer
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\studio\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package (Linux tarball)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          d="mumax-studio-linux${{ matrix.edition }}"
          mkdir -p "pkg/$d"
          cp -r dist/mumax-studio "pkg/$d/"
          cp packaging/install-linux.sh packaging/mumax-studio.desktop packaging/icon.png README.md LICENSE "pkg/$d/"
          chmod +x "pkg/$d/install-linux.sh"
          tar -C pkg -czf "dist/$d.tar.gz" "$d"
      - name: Package (macOS zip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --keepParent dist/mumax-studio.app "dist/mumax-studio-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mumax-studio-${{ matrix.os }}${{ matrix.edition }}
          path: |
            studio/dist/*-setup.exe
            studio/dist/*.zip
            studio/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/checkout@v4
        with: { path: src, sparse-checkout: studio/CHANGES.md, sparse-checkout-cone-mode: false }
      - name: Release notes (this version's section of studio/CHANGES.md, then the install notes)
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p=($2==v); if(p){print "## What is new in " v; next}} p' src/studio/CHANGES.md > notes.md
          cat >> notes.md <<'EOF'

          ## Install
          - **Windows:** run `mumax-studio-windows-setup.exe` (or unzip the portable build).
          - **Linux:** unpack the `.tar.gz` and run `./install-linux.sh`, or start `mumax-studio/mumax-studio` directly.
          - **macOS (Apple silicon):** unzip and open `mumax-studio.app` (right-click → Open the first time; the app is not notarised).
          - The `-nvidia` builds include CuPy and the CUDA 12 runtime for NVIDIA GPUs; they need only a recent NVIDIA driver (525 or newer). All builds also run on the CPU.
          - `SHA256SUMS.txt` lists the checksum of every file. On Windows: `Get-FileHash .\mumax-studio-windows-setup.exe`.
          - If Windows SmartScreen says "Windows protected your PC", choose **More info → Run anyway** (shown while a new release has not yet built up download reputation). Python users can avoid installers entirely: `pip install "mumax-studio @ git+https://github.com/jasem109/mumax_studio#subdirectory=studio"`.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body_path: notes.md
